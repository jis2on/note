<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 필기 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F2E4;
    --paper-line: #D9CFB4;
    --ink: #26344A;
    --ink-soft: #5B6A80;
    --margin-red: #B6413A;
    --hole: #E7DEC3;
    --shadow: rgba(38,52,74,0.16);
    --page-w: 794px;
    --page-h: 1123px;
    --note-font: 'Noto Sans KR', sans-serif;
    --note-color: #26344A;
    --line-gap: 56px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: #E3DBC6;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  .app{
    display:flex;
    min-height:100vh;
    align-items: stretch;
  }

  .spine{
    width: 26px;
    background: repeating-linear-gradient(
      180deg,
      #C9BE9E 0px, #C9BE9E 22px,
      #B9AD89 22px, #B9AD89 24px
    );
    flex-shrink:0;
    position: relative;
  }
  .spine::before{
    content:"";
    position:absolute; top:0; left:100%;
    width:8px; height:100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.14), transparent);
  }

  .sidebar{
    width: 250px;
    flex-shrink:0;
    background: #EFE6CC;
    padding: 28px 16px 28px 22px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    border-right: 1px solid var(--paper-line);
    overflow-y:auto;
  }

  .sidebar h1{
    font-family:'Song Myung', serif;
    font-size: 22px;
    margin: 0 4px 4px 4px;
    line-height:1.3;
    color: var(--ink);
  }
  .sidebar .sub{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 4px 18px 4px;
  }

  .unit-tab{
    position: relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 14px;
    margin-right: -12px;
    border-radius: 4px 0 0 4px;
    cursor:pointer;
    background: #E4D9B9;
    border: 1px solid var(--paper-line);
    border-right: none;
    font-size: 14px;
    font-weight:500;
    color: var(--ink-soft);
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .unit-tab:hover{ transform: translateX(-3px); }
  .unit-tab .dot{
    width:10px; height:10px; border-radius:50%;
    flex-shrink:0;
  }
  .unit-tab .label{
    flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .unit-tab .pagecount{
    font-size:11.5px;
    color: var(--ink-soft);
    flex-shrink:0;
  }
  .unit-tab.active{
    background: var(--paper);
    color: var(--ink);
    font-weight:700;
    transform: translateX(-6px);
    box-shadow: -3px 3px 8px var(--shadow);
    z-index: 2;
  }
  .unit-tab .del-btn{
    opacity:0;
    background:none; border:none; cursor:pointer;
    color:#a44; font-size:15px; padding:2px 4px;
    border-radius:4px;
  }
  .unit-tab:hover .del-btn{ opacity:0.6; }
  .unit-tab .del-btn:hover{ opacity:1; background:rgba(180,60,50,0.12); }

  .add-unit{
    margin-top: 8px;
    margin-right: -12px;
    padding: 10px 14px;
    border-radius: 4px 0 0 4px;
    border: 1.5px dashed var(--paper-line);
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    cursor:pointer;
    text-align:left;
  }
  .add-unit:hover{ background: rgba(255,255,255,0.35); color: var(--ink); }

  .font-settings{
    margin-top: 4px;
    padding: 12px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .font-settings .fs-label{
    font-size: 12px;
    font-weight:700;
    color: var(--ink-soft);
    margin-bottom: 3px;
    display:block;
  }
  .fs-hint{
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-soft);
    opacity: .85;
    margin: 6px 0;
  }
  .font-settings .pen-sub-btn{ width:100%; margin-top:5px; }
  .font-settings select{
    width:100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
  }

  .pen-panel{
    margin-top: 4px;
    padding: 12px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .pen-tools{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .pen-colors{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
  }
  .pen-color{
    width:20px; height:20px; border-radius:50%;
    cursor:pointer;
    border: 2px solid transparent;
    box-shadow: 0 0 0 1px var(--paper-line);
  }
  .pen-color.sel{ border-color: #fff; box-shadow: 0 0 0 2px var(--ink); }
  .pen-tools select{
    width:100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
  }
  .pen-sub-btn{
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink-soft);
    cursor:pointer;
    text-align:left;
  }
  .pen-sub-btn:hover{ color: var(--ink); background: #FAF7EE; }
  .pen-sub-btn.on{
    background: var(--margin-red);
    border-color: var(--margin-red);
    color: #fff;
  }

  .draw-canvas{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    z-index: 5;
    pointer-events: none;
    touch-action: none;
  }
  .page.pen-active .draw-canvas{
    pointer-events: auto;
    cursor: crosshair;
  }
  .page.pen-active .page-header,
  .page.pen-active .cornell-body,
  .page.pen-active .summary-row{
    pointer-events: none;
  }

  .sidebar-foot{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding: 0 4px;
  }
  .mode-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    font-weight:700;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor:pointer;
    transition: all .15s ease;
  }
  .mode-btn.on{
    background: var(--margin-red);
    border-color: var(--margin-red);
    color: #fff;
  }
  .save-note{
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align:center;
    min-height: 14px;
  }

  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 30px 20px;
    overflow:auto;
  }

  .page-nav{
    width: var(--page-w);
    display:flex;
    align-items:flex-end;
    gap: 4px;
    margin-bottom: -1px;
    z-index: 3;
    position:relative;
    flex-wrap: wrap;
    flex-shrink:0;
  }
  .page-chip{
    padding: 7px 14px 8px 14px;
    background: #E4D9B9;
    border: 1px solid var(--paper-line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .page-chip.active{
    background: var(--paper);
    color: var(--ink);
    font-weight:700;
    box-shadow: 0 -3px 6px var(--shadow);
  }
  .page-chip .pg-del{
    opacity:0;
    background:none;border:none;cursor:pointer;
    color:#a44; font-size:13px; line-height:1;
  }
  .page-chip:hover .pg-del{ opacity:0.6; }
  .page-chip .pg-del:hover{ opacity:1; }
  .page-add-chip{
    padding: 7px 12px 8px 12px;
    background: transparent;
    border: 1.5px dashed var(--paper-line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .page-add-chip:hover{ background: rgba(255,255,255,0.4); color: var(--ink); }

  .page-shell{
    width: var(--page-w);
    flex-shrink:0;
  }

  .page{
    width: var(--page-w);
    height: var(--page-h);
    background:
      repeating-linear-gradient(180deg, transparent 0px, transparent calc(var(--line-gap) - 1px), var(--paper-line) calc(var(--line-gap) - 1px), var(--paper-line) var(--line-gap)),
      var(--paper);
    box-shadow: 0 10px 30px var(--shadow), 0 2px 6px var(--shadow);
    border-radius: 0 6px 6px 6px;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .page::before{
    content:"";
    position:absolute; left:14px; top:0; bottom:0; width:0;
    border-left: 2px dotted var(--hole);
  }

  .page-header{
    flex-shrink:0;
    padding: 22px 30px 12px 30px;
    border-bottom: 2px solid var(--ink);
    margin: 0 20px;
  }
  .unit-title{
    font-family:'Song Myung', serif;
    font-size: 24px;
    color: var(--ink);
    outline:none;
    line-height:1.3;
  }
  .unit-title[contenteditable="true"]:hover,
  .unit-title[contenteditable="true"]:focus{
    background: rgba(182,65,58,0.06);
    border-radius: 4px;
  }
  .meta-row{
    display:flex; gap:14px; align-items:center;
    margin-top:6px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .meta-row input[type="date"]{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color: var(--ink-soft);
    border:none; background:transparent;
    outline:none;
  }
  .page-indicator{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .color-picker{ display:flex; gap:6px; margin-left:auto; }
  .color-swatch{
    width:15px; height:15px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .color-swatch.sel{ border-color: var(--ink); }

  .cornell-body{
    display:flex;
    flex: 1 1 0;
    min-height: 0;
    margin: 0 20px;
  }
  .cue-col{
    width: 200px;
    flex-shrink:0;
    padding: 14px 18px 14px 30px;
    border-right: 3px solid var(--margin-red);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .cue-col .col-label, .notes-col .col-label, .summary-row .col-label{
    font-weight:700;
    font-size: 12px;
    letter-spacing:0.5px;
    color: var(--margin-red);
    margin-bottom: 6px;
    text-transform: uppercase;
    flex-shrink:0;
  }
  .notes-col .col-label{ color: var(--ink-soft); }
  .summary-row .col-label{ color: var(--ink-soft); }

  .notes-col{
    flex:1;
    min-height:0;
    padding: 14px 30px 14px 22px;
    display:flex;
    flex-direction:column;
  }

  .editable{
    font-family: var(--note-font);
    font-weight: 400;
    color: var(--note-color);
    outline:none;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
  }
  [contenteditable="true"].editable:hover{
    background: rgba(182,65,58,0.035);
  }
  [contenteditable="true"].editable:focus{
    background: rgba(182,65,58,0.05);
  }
  .editable:empty:before{
    content: attr(data-placeholder);
    color: #A79E86;
    font-style: italic;
  }

  .editable img{
    display:block;
    max-width: 100%;
    height: auto;
    margin: 6px 0;
    border-radius: 4px;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .editable img.img-s{ max-width: 35%; }
  .editable img.img-m{ max-width: 65%; }
  .editable img.img-l{ max-width: 100%; }
  body:not(.locked) .editable img{ cursor: zoom-in; }

  .summary-row{
    flex-shrink:0;
    height: 150px;
    margin: 14px 20px 20px 20px;
    padding: 12px 30px;
    border-top: 2px solid var(--ink);
    background: rgba(182,65,58,0.045);
    border-radius: 0 0 3px 3px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .locked-hint{
    display:none;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 30px 0 30px;
    margin: 0 20px;
    flex-shrink:0;
  }
  body.locked .locked-hint{ display:block; }

  .empty-state{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    color: var(--ink-soft);
    font-size:16px;
    padding: 60px;
    text-align:center;
  }

  @media (max-width: 900px){
    .sidebar{ width: 220px; }
  }
  @media (max-width: 620px){
    .app{ flex-direction:column; }
    .spine{ width:100%; height:16px; }
    .sidebar{ width:100%; flex-direction:column; border-right:none; border-bottom:1px solid var(--paper-line); max-height:60vh; }
    .main{ padding: 16px 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="spine"></div>
  <aside class="sidebar">
    <h1>수업 필기 노트</h1>
    <div class="sub">단원별 정리를 모아두는 공간</div>
    <div id="tabList"></div>
    <button class="add-unit" id="addUnitBtn">+ 새 단원 추가</button>

    <div class="font-settings" id="fontSettings" style="display:none">
      <div>
        <span class="fs-label">글씨체</span>
        <select id="fontFamilySelect">
          <option value="'Noto Sans KR', sans-serif">고딕체 (기본)</option>
          <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
          <option value="'IBM Plex Sans KR', sans-serif">IBM Plex</option>
          <option value="'Song Myung', serif">명조체</option>
          <option value="'Noto Serif KR', serif">바탕체(세리프)</option>
          <option value="'Gowun Batang', serif">고운 바탕체</option>
        </select>
      </div>
      <div>
        <span class="fs-label">글씨크기</span>
        <select id="fontSizeSelect">
          <option value="12">작게</option>
          <option value="15">보통</option>
          <option value="18">크게</option>
          <option value="21">아주 크게</option>
        </select>
      </div>
      <div>
        <span class="fs-label">전체 글씨 색</span>
        <div class="pen-colors" id="textColorSwatches">
          <span class="pen-color text-color-swatch sel" data-color="#26344A" style="background:#26344A"></span>
          <span class="pen-color text-color-swatch" data-color="#B6413A" style="background:#B6413A"></span>
          <span class="pen-color text-color-swatch" data-color="#2C5F8A" style="background:#2C5F8A"></span>
          <span class="pen-color text-color-swatch" data-color="#3E7C6B" style="background:#3E7C6B"></span>
          <span class="pen-color text-color-swatch" data-color="#7C4A6B" style="background:#7C4A6B"></span>
          <span class="pen-color text-color-swatch" data-color="#111111" style="background:#111111"></span>
        </div>
      </div>
      <div>
        <span class="fs-label">선택한 글자만 색 바꾸기</span>
        <div class="pen-colors" id="selColorSwatches">
          <span class="pen-color sel-color-swatch" data-color="#B6413A" style="background:#B6413A"></span>
          <span class="pen-color sel-color-swatch" data-color="#2C5F8A" style="background:#2C5F8A"></span>
          <span class="pen-color sel-color-swatch" data-color="#3E7C6B" style="background:#3E7C6B"></span>
          <span class="pen-color sel-color-swatch" data-color="#C98A2C" style="background:#C98A2C"></span>
          <span class="pen-color sel-color-swatch" data-color="#7C4A6B" style="background:#7C4A6B"></span>
          <span class="pen-color sel-color-swatch" data-color="#111111" style="background:#111111"></span>
        </div>
        <div class="fs-hint">글자를 드래그해 선택한 뒤 색을 누르세요</div>
        <button class="pen-sub-btn" id="clearSelColorBtn">선택 글자 색 되돌리기</button>
        <button class="pen-sub-btn" id="boldSelBtn">굵게 / 해제</button>
        <button class="pen-sub-btn" id="highlightSelBtn">🖍 형광펜 / 해제</button>
      </div>
      <div>
        <span class="fs-label">그림 넣기</span>
        <button class="pen-sub-btn" id="insertImageBtn">🖼️ 그림 파일 불러오기</button>
        <div class="fs-hint">칸을 클릭한 뒤 Ctrl+V로 붙여넣기 하거나, 그림을 끌어다 놓아도 돼요. 그림을 클릭하면 크기가 바뀝니다.</div>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none">
      </div>
    </div>

    <div class="pen-panel" id="penPanel" style="display:none">
      <button class="mode-btn" id="penToggleBtn">🖊️ 펜 켜기</button>
      <div class="pen-tools" id="penTools" style="display:none">
        <span class="fs-label">펜 색상</span>
        <div class="pen-colors">
          <span class="pen-color sel" data-color="#26344A" style="background:#26344A"></span>
          <span class="pen-color" data-color="#B6413A" style="background:#B6413A"></span>
          <span class="pen-color" data-color="#2C5F8A" style="background:#2C5F8A"></span>
          <span class="pen-color" data-color="#3E7C6B" style="background:#3E7C6B"></span>
          <span class="pen-color" data-color="#C98A2C" style="background:#C98A2C"></span>
        </div>
        <span class="fs-label">굵기</span>
        <select id="penWidthSelect">
          <option value="2">얇게</option>
          <option value="4" selected>보통</option>
          <option value="7">굵게</option>
        </select>
        <button class="pen-sub-btn" id="eraserBtn">🧹 지우개</button>
        <button class="pen-sub-btn" id="clearCanvasBtn">이 페이지 그림 지우기</button>
      </div>
    </div>

    <div class="sidebar-foot">
      <button class="mode-btn" id="modeBtn">✏️ 편집 모드 켜기</button>
      <button class="mode-btn" id="changePassBtn" style="display:none">🔑 비밀번호 변경</button>
      <div class="save-note" id="saveNote"></div>
    </div>
  </aside>

  <main class="main">
    <div class="page-nav" id="pageNav"></div>
    <div class="page-shell" id="pageShell">
      <div class="page" id="pageEl"></div>
    </div>
  </main>
</div>

<script>
const COLORS = ['#3E7C6B','#C98A2C','#7C4A6B','#2C5F8A','#A34C36'];
const MIN_FONT = 9;

// ---- GitHub-backed storage (works on real hosting, unlike window.storage) ----
const GH_OWNER = 'jis2on';
const GH_REPO = 'note';
const DATA_PATH = 'note-data.json';
const TOKEN_LS_KEY = 'cornell-gh-token';

let ghBranch = null;
let ghToken = null;
let units = [];
let activeId = null;
let editMode = false;
let saveTimer = null;
let activePageMap = {};
let drawings = {};
let passHash = null;
let settings = { fontFamily: "'Noto Sans KR', sans-serif", fontSize: 15, textColor: '#26344A' };

function uid(pre){ return (pre||'u') + '_' + Math.random().toString(36).slice(2,10); }
function emptyPage(){ return { id: uid('p'), cue:'', notes:'', summary:'' }; }
function defaultUnits(){
  return [{
    id: uid('u'),
    title: '1단원. 새 단원',
    color: COLORS[0],
    date: '',
    pages: [ emptyPage() ]
  }];
}
function migrate(list){
  return (list || []).map(u => {
    if(!u.pages){
      u.pages = [{ id: uid('p'), cue: u.cue||'', notes: u.notes||'', summary: u.summary||'' }];
      delete u.cue; delete u.notes; delete u.summary;
    }
    if(!u.pages.length) u.pages = [emptyPage()];
    return u;
  });
}

function maxFontFor(field){
  return field === 'cue' ? settings.fontSize + 1 : settings.fontSize;
}
function applyFontFamilyCSS(){
  document.documentElement.style.setProperty('--note-font', settings.fontFamily);
}
function applyTextColorCSS(){
  document.documentElement.style.setProperty('--note-color', settings.textColor);
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function resolveBranch(){
  if(ghBranch) return ghBranch;
  try{
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`);
    if(res.ok){
      const j = await res.json();
      ghBranch = j.default_branch || 'main';
      return ghBranch;
    }
  }catch(e){ /* fall through */ }
  ghBranch = 'main';
  return ghBranch;
}

async function loadRemoteData(){
  const branch = await resolveBranch();
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${branch}/${DATA_PATH}?_=${Date.now()}`, { cache: 'no-store' });
    if(res.ok) return await res.json();
  }catch(e){ /* no data yet, or offline */ }
  return null;
}

async function ensureToken(){
  if(ghToken) return ghToken;
  try{
    const stored = localStorage.getItem(TOKEN_LS_KEY);
    if(stored){ ghToken = stored; return ghToken; }
  }catch(e){ /* ignore */ }
  return null;
}
async function promptForToken(){
  const t = prompt('저장하려면 이 저장소(jis2on/note)에 쓰기 권한이 있는 GitHub 개인 액세스 토큰(PAT)이 필요해요.\n\n한 번만 입력하면 이 브라우저에 저장되고, 학생에게는 보이지 않습니다.\n토큰을 입력해주세요:');
  if(!t) return null;
  ghToken = t.trim();
  try{ localStorage.setItem(TOKEN_LS_KEY, ghToken); }catch(e){ /* ignore */ }
  return ghToken;
}

async function getFileSha(token, branch){
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${DATA_PATH}?ref=${branch}`, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
  });
  if(res.status === 404) return null;
  if(res.status === 401 || res.status === 403){
    try{ localStorage.removeItem(TOKEN_LS_KEY); }catch(e){}
    ghToken = null;
    throw new Error('토큰이 유효하지 않거나 저장소 쓰기 권한이 없습니다.');
  }
  if(!res.ok) throw new Error('GitHub 연결 실패 (코드 ' + res.status + ')');
  const j = await res.json();
  return j.sha;
}

async function commitData(){
  let token = await ensureToken();
  if(!token){
    token = await promptForToken();
    if(!token) throw new Error('토큰이 없어 저장할 수 없습니다.');
  }
  const branch = await resolveBranch();
  const sha = await getFileSha(token, branch);
  const payload = { units, settings, drawings, passHash };
  const body = {
    message: '노트 업데이트 ' + new Date().toISOString(),
    content: utf8ToBase64(JSON.stringify(payload)),
    branch
  };
  if(sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${DATA_PATH}`, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    if(res.status === 401 || res.status === 403){
      try{ localStorage.removeItem(TOKEN_LS_KEY); }catch(e){}
      ghToken = null;
      throw new Error('토큰이 유효하지 않거나 쓰기 권한이 없습니다. 다시 저장을 시도하면 토큰을 새로 입력할 수 있어요.');
    }
    const errJson = await res.json().catch(() => ({}));
    throw new Error(errJson.message || ('저장 실패 (코드 ' + res.status + ')'));
  }
  return true;
}

function scheduleSave(){
  clearTimeout(saveTimer);

    }catch(e){

  }, 3000);
}

const MAX_IMG_DIM = 900;

function downscaleImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('이미지를 열 수 없습니다.'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, MAX_IMG_DIM / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        const cx = c.getContext('2d');
        cx.fillStyle = '#FFFFFF';
        cx.fillRect(0, 0, width, height);
        cx.drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function insertImageFile(file){
  if(!lastFocusedEditable){
    alert('그림을 넣을 칸을 먼저 클릭해주세요.');
    return;
  }
  try{
    const dataUrl = await downscaleImage(file);
    lastFocusedEditable.focus();
    const ok = document.execCommand('insertHTML', false, `<img src="${dataUrl}" class="img-m">`);
    if(!ok){
      const img = document.createElement('img');
      img.src = dataUrl;
      img.className = 'img-m';
      lastFocusedEditable.appendChild(img);
    }
    lastFocusedEditable.dispatchEvent(new Event('input'));
  }catch(e){
    alert('그림을 넣지 못했습니다: ' + e.message);
  }
}

      </div>
    </div>
    <div class="summary-row">
      <div class="col-label">이 페이지 정리</div>
      <div class="editable" contenteditable="${canEdit}" data-field="summary" data-max-font="${maxFontFor('summary')}" data-placeholder="한 문단으로 오늘 배운 내용을 정리해보세요">${p.summary || ''}</div>
    </div>
    <canvas class="draw-canvas" id="drawCanvas"></canvas>
  `;

  page.querySelectorAll('[data-field]').forEach(el => {
    const field = el.dataset.field;
    if(field === 'title'){
      el.addEventListener('input', () => { u.title = el.innerHTML; renderTabsDebounced(); scheduleSave(); });
      return;
    }
    if(field === 'date'){
      el.addEventListener('change', () => { u.date = el.value; scheduleSave(); });
      return;
    }
    el.addEventListener('input', () => {
      p[field] = el.innerHTML;
      fitText(el);
      scheduleSave();
    });

    el.addEventListener('focus', () => { lastFocusedEditable = el; });
    el.addEventListener('mouseup', () => { lastFocusedEditable = el; });

    el.addEventListener('paste', async (e) => {
      if(!editMode) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      let imageFile = null;
      for(const it of items){
        if(it.type && it.type.indexOf('image') === 0){ imageFile = it.getAsFile(); break; }
      }
      if(!imageFile) return;
      e.preventDefault();
      lastFocusedEditable = el;
      await insertImageFile(imageFile);
    });

    el.addEventListener('dragover', (e) => { if(editMode) e.preventDefault(); });
    el.addEventListener('drop', async (e) => {
      if(!editMode) return;
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file || file.type.indexOf('image') !== 0) return;
      e.preventDefault();
      lastFocusedEditable = el;
      await insertImageFile(file);
    });

    el.addEventListener('click', (e) => {
      if(!editMode) return;
      if(e.target.tagName !== 'IMG') return;
      const img = e.target;
      const order = ['img-m', 'img-l', 'img-s'];
      const cur = order.find(c => img.classList.contains(c)) || 'img-m';
      const next = order[(order.indexOf(cur) + 1) % order.length];
      order.forEach(c => img.classList.remove(c));
      img.classList.add(next);
      p[field] = el.innerHTML;
      fitText(el);
      scheduleSave();
    });
  });

  page.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      u.color = sw.dataset.color;
      renderTabs();
      renderPage();
      scheduleSave();
    });
  });

  initCanvas(p.id);
  requestAnimationFrame(() => requestAnimationFrame(refitAll));
}

function fitText(el){
  if(!el.dataset.maxFont) return;
  const max = parseFloat(el.dataset.maxFont);
  let size = max;
  el.style.fontSize = size + 'px';
  let guard = 0;
  while(el.scrollHeight > el.clientHeight + 1 && size > MIN_FONT && guard < 80){
    size -= 0.5;
    el.style.fontSize = size + 'px';
    guard++;
  }
}

// ---- pen / drawing ----
const PAGE_W = 794, PAGE_H = 1123;
let penMode = false;
let penColor = '#26344A';
let penWidth = 4;
let eraserMode = false;
let currentCanvas = null;
let currentPageId = null;

function initCanvas(pageId){
  const canvas = document.getElementById('drawCanvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = PAGE_W * dpr;
  canvas.height = PAGE_H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const existing = drawings[pageId];
  if(existing){
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, PAGE_W, PAGE_H); };
    img.src = existing;
  }
  currentCanvas = canvas;
  currentPageId = pageId;

  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function start(e){
    drawing = true;
    const { x, y } = pos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function move(e){
    if(!drawing) return;
    const { x, y } = pos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = penColor;
    ctx.lineWidth = eraserMode ? 24 : penWidth;
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  function end(){
    if(!drawing) return;
    drawing = false;
    drawings[pageId] = canvas.toDataURL('image/png');
    scheduleSave();
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointerleave', end);
}

async function checkPassword(pw){

async function tryEnableEdit(){
  let token = await ensureToken();
  if(!token){
    alert('편집하려면 먼저 이 저장소에 쓰기 권한이 있는 GitHub 토큰이 필요해요. 다음 창에 입력해주세요.');

    if(!token) return;
  }
  if(!passHash){
    const p1 = prompt('편집 모드에 사용할 교사 비밀번호를 새로 설정해주세요 (4자 이상).');
    if(p1 === null) return;
    if(p1.length < 4){ alert('비밀번호는 4자 이상으로 설정해주세요.'); return; }
    const p2 = prompt('확인을 위해 비밀번호를 한 번 더 입력해주세요.');
    if(p2 !== p1){ alert('비밀번호가 일치하지 않습니다. 다시 시도해주세요.'); return; }
    passHash = await sha256Hex(p1);
    document.getElementById('saveNote').textContent = 'GitHub에 저장 중…';
    try{
      await commitData();
      document.getElementById('saveNote').textContent = '저장됨';
      editMode = true;
      updateModeBtn(); renderTabs(); renderPage();
      alert('편집 비밀번호가 설정되고 GitHub 저장소에 저장되었습니다. 다음부터는 이 비밀번호로 편집 모드를 켤 수 있어요.');
    }catch(e){
      passHash = null;
      document.getElementById('saveNote').textContent = '저장 실패 · ' + e.message;
      alert('비밀번호 저장에 실패했습니다: ' + e.message);
    }
    return;
  }
  const input = prompt('편집 모드 비밀번호를 입력하세요.');
  if(input === null) return;
  const ok = await checkPassword(input);
  if(ok){
    editMode = true;
    updateModeBtn(); renderTabs(); renderPage();
  } else {
    alert('비밀번호가 올바르지 않습니다.');
  }
}

document.getElementById('modeBtn').addEventListener('click', () => {
  if(editMode){
    editMode = false;
    updateModeBtn();
    renderTabs();
    renderPage();
    return;
  }
  tryEnableEdit();
});

document.getElementById('changePassBtn').addEventListener('click', async () => {
  const cur = prompt('현재 비밀번호를 입력하세요.');
  if(cur === null) return;
  const ok = await checkPassword(cur);
  if(!ok){ alert('현재 비밀번호가 올바르지 않습니다.'); return; }
  const p1 = prompt('새 비밀번호를 입력하세요 (4자 이상).');
  if(p1 === null) return;
  if(p1.length < 4){ alert('비밀번호는 4자 이상으로 설정해주세요.'); return; }
  const p2 = prompt('새 비밀번호를 한 번 더 입력해주세요.');
  if(p2 !== p1){ alert('비밀번호가 일치하지 않습니다.'); return; }
  const oldHash = passHash;
  passHash = await sha256Hex(p1);
  document.getElementById('saveNote').textContent = 'GitHub에 저장 중…';
  try{
    await commitData();
    document.getElementById('saveNote').textContent = '저장됨';
    alert('비밀번호가 변경되었습니다.');
  }catch(e){
    passHash = oldHash;
    alert('비밀번호 변경에 실패했습니다: ' + e.message);
  }
});

function updateModeBtn(){
  const btn = document.getElementById('modeBtn');
  const changeBtn = document.getElementById('changePassBtn');
  const fontPanel = document.getElementById('fontSettings');
  const penPanel = document.getElementById('penPanel');
  document.body.classList.toggle('locked', !editMode);
  if(editMode){
    btn.textContent = '👁 보기 모드로 전환';
    btn.classList.add('on');
    changeBtn.style.display = 'block';
    fontPanel.style.display = 'flex';
    penPanel.style.display = 'flex';
  } else {
    btn.textContent = '✏️ 편집 모드 켜기';
    btn.classList.remove('on');
    changeBtn.style.display = 'none';
    fontPanel.style.display = 'none';
    penPanel.style.display = 'none';
    penMode = false;
    eraserMode = false;
    document.getElementById('penToggleBtn').textContent = '🖊️ 펜 켜기';
    document.getElementById('penToggleBtn').classList.remove('on');
    document.getElementById('penTools').style.display = 'none';
    document.getElementById('eraserBtn').classList.remove('on');
    const pageEl = document.getElementById('pageEl');
    if(pageEl) pageEl.classList.remove('pen-active');
  }
}

updateModeBtn();
loadAll();
</script>
</body>
</html>
